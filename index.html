<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Häyhä Floats – Floating Sauna & Pontoon Rentals in Utah</title>
  <style>
    :root {
      --bg-dark: #021220;
      --bg-hero: radial-gradient(circle at top left, #123b57, #020b18);
      --accent: #f9a826;
      --accent-soft: rgba(249, 168, 38, 0.12);
      --text-light: #f7fafc;
      --text-muted: #c0cad8;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --shadow-soft: 0 18px 35px rgba(15, 23, 42, 0.35);
      --max-width: 1120px;
      --radius-lg: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Segoe UI", sans-serif;
      color: #0f172a;
      background-color: #f3f4f6;
    }

    /* HEADER / NAV */

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(16px);
      background: linear-gradient(
        to bottom,
        rgba(2, 8, 23, 0.9),
        rgba(2, 8, 23, 0.7),
        transparent
      );
      border-bottom: 1px solid rgba(148, 163, 184, 0.2);
    }

    .nav-inner {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo-text {
      font-weight: 700;
      letter-spacing: 0.08em;
      font-size: 0.85rem;
      color: var(--text-light);
      text-transform: uppercase;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      margin-left: 1.5rem;
      position: relative;
      padding-bottom: 0.25rem;
    }

    nav a:hover {
      color: var(--text-light);
    }

    nav a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 2px;
      background: var(--accent);
      transition: width 0.18s ease-out;
    }

    nav a:hover::after {
      width: 100%;
    }

    .nav-cta {
      margin-left: 1.5rem;
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      border: 1px solid rgba(248, 250, 252, 0.3);
      background: linear-gradient(
        to right,
        rgba(249, 168, 38, 0.15),
        rgba(248, 250, 252, 0.05)
      );
      color: #fefce8;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .nav-cta:hover {
      border-color: var(--accent);
      background: rgba(249, 168, 38, 0.23);
      color: #0f172a;
    }

    /* HERO */

    .hero {
      background: var(--bg-hero);
      color: var(--text-light);
      padding: 4.5rem 1.5rem 4rem;
    }

    .hero-inner {
      max-width: var(--max-width);
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
      gap: 3rem;
      align-items: center;
    }

    .hero-kicker {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }

    .hero h1 {
      font-size: clamp(2.2rem, 3.2vw + 1.5rem, 3.2rem);
      line-height: 1.05;
      margin: 0 0 1rem;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 0.98rem;
      max-width: 32rem;
      margin-bottom: 1.75rem;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.8rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, #fbbf24, #f97316);
      color: #111827;
      padding: 0.9rem 1.6rem;
      border-radius: 999px;
      border: none;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 14px 32px rgba(249, 115, 22, 0.45);
      text-decoration: none;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 40px rgba(249, 115, 22, 0.6);
    }

    .btn-ghost {
      color: var(--text-muted);
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      padding: 0.8rem 1.4rem;
      background: rgba(15, 23, 42, 0.7);
      font-size: 0.9rem;
      text-decoration: none;
    }

    .btn-ghost:hover {
      border-color: var(--accent);
      color: var(--text-light);
    }

    .hero-note {
      margin-top: 1.1rem;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .hero-card {
      background: radial-gradient(circle at top, #1f2937, #020617);
      border-radius: 22px;
      padding: 1.7rem 1.6rem;
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(148, 163, 184, 0.45);
    }

    .hero-card h3 {
      margin: 0 0 0.6rem;
      font-size: 1rem;
    }

    .hero-card p {
      margin: 0;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* GENERAL LAYOUT */

    .section {
      padding: 3.5rem 1.5rem;
    }

    .container {
      max-width: var(--max-width);
      margin: 0 auto;
    }

    .section h2 {
      font-size: 1.7rem;
      margin-bottom: 0.6rem;
    }

    .section p.lead {
      margin-top: 0;
      color: #4b5563;
      max-width: 38rem;
      font-size: 0.98rem;
    }

    /* HOW IT WORKS */

    .how-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .how-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 1.4rem 1.3rem;
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
    }

    .how-step {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #6b7280;
      margin-bottom: 0.35rem;
    }

    .how-card h3 {
      margin: 0 0 0.4rem;
      font-size: 1.02rem;
    }

    .how-card p {
      margin: 0;
      font-size: 0.9rem;
      color: #4b5563;
    }

    /* BOOKING SECTION */

    .booking-section {
      background: radial-gradient(circle at top, #0b253a, #020617);
      color: var(--text-light);
    }
